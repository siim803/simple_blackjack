<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game of blackjack</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="blackjack-container">
            <!-- Dealer Section -->
            <div class="table-section dealer-section">
                <h2 class="section-title">Dealer</h2>
                <div id="dealer-cards" class="cards-area">
                    <img id="hidden" src="./cards/BACK.png" class="card-image">
                </div>
                <div class="hand-value-indicator">
                    <span class="value-label">Hand Value:</span>
                    <span id="dealer-sum" class="value-display">0</span>
                </div>
            </div>

            <!-- Results Display -->
            <div class="results-section">
                <p id="results" class="results-text"></p>
            </div>

            <!-- Player Section -->
            <div class="table-section player-section">
                <h2 class="section-title">You</h2>
                <div id="your-cards" class="cards-area"></div>
                <div class="hand-value-indicator">
                    <span class="value-label">Hand Value:</span>
                    <span id="your-sum" class="value-display">0</span>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="controls-section">
                <button id="hit" class="game-button hit-button">Hit</button>
                <button id="stand" class="game-button stand-button">Stand</button>
                <button id="split" class="game-button split-button">Split</button>
                <button id="restart" class="game-button restart-button">Restart</button>
                <a href="LandingPage.html" class="back-link">
                    <button id="Back" class="game-button back-button">Back</button>
                </a>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
